name: Build & Push Image Gen Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. latest, v1.0)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-image-gen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.image
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
          build-args: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
